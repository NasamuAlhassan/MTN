<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="Just say what you need. Tap Zigi and speak Twi, Kusaal or English.">
  <defs>
    <linearGradient id="pfield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD426"/>
      <stop offset="1" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="pfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="pclip"><rect width="720" height="336" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#pclip)">
    <rect width="720" height="336" fill="url(#pfield)"/>

    <!-- radiating rays, echoing the brand's burst motif without copying artwork -->
    <g opacity="0.13" fill="#000000">
      <path d="M640 168 L900 -60 L980 40 Z"/>
      <path d="M640 168 L960 90 L980 200 Z"/>
      <path d="M640 168 L940 300 L860 396 Z"/>
      <path d="M640 168 L820 420 L700 440 Z"/>
    </g>
    <rect width="720" height="336" fill="url(#pfade)"/>

    <!-- concept tag -->
    <rect x="44" y="42" width="150" height="30" rx="15" fill="#000000"/>
    <text x="119" y="62" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif"
          font-size="12" font-weight="700" letter-spacing="1.6" fill="#FFCB05">CONCEPT DEMO</text>

    <text x="44" y="140" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#0A0A0A" letter-spacing="-1">JUST SAY WHAT</text>
    <text x="44" y="188" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="44" font-weight="800" fill="#0A0A0A" letter-spacing="-1">YOU NEED</text>

    <text x="44" y="228" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="600" fill="#3A2E00">Tap Zigi and speak Twi, Kusaal or English.</text>

    <!-- waveform motif -->
    <g fill="#0A0A0A" opacity="0.85">
      <rect x="44" y="266" width="6" height="20" rx="3"/>
      <rect x="58" y="258" width="6" height="36" rx="3"/>
      <rect x="72" y="248" width="6" height="56" rx="3"/>
      <rect x="86" y="262" width="6" height="28" rx="3"/>
      <rect x="100" y="252" width="6" height="48" rx="3"/>
      <rect x="114" y="266" width="6" height="20" rx="3"/>
      <rect x="128" y="256" width="6" height="40" rx="3"/>
      <rect x="142" y="268" width="6" height="16" rx="3"/>
    </g>

    <!-- mic glyph -->
    <g transform="translate(560,168)" opacity="0.9">
      <circle r="74" fill="#0A0A0A"/>
      <g fill="#FFCB05" transform="translate(-19,-26)">
        <rect x="11" y="0" width="16" height="30" rx="8"/>
        <path d="M4 24a15 15 0 0 0 30 0" fill="none" stroke="#FFCB05" stroke-width="4.5" stroke-linecap="round"/>
        <rect x="17" y="39" width="4" height="9" rx="2"/>
        <rect x="10" y="48" width="18" height="4" rx="2"/>
      </g>
    </g>
  </g>
</svg>
