<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Zigi Voice — it understands the need, not the menu name. Speak Twi, Kusaal or English; Zigi maps what you say to the right product, reads it back, and stops at the PIN.">
  <defs>
    <style><![CDATA[
      .s { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }

      /* Only the demo line moves. Three utterances, cut cleanly, 5s each. */
      .rot { opacity: 0; animation: rot 15s linear infinite; }
      @keyframes rot { 0%, 31% { opacity: 1; } 33%, 100% { opacity: 0; } }
      .r2 { animation-delay: 5s; }
      .r3 { animation-delay: 10s; }

      .caret { animation: caret 1.06s steps(1) infinite; }
      @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    ]]></style>
  </defs>

  <rect width="1280" height="440" fill="#FFCB05"/>

  <text class="s" x="88" y="80" font-size="11.5" font-weight="700" letter-spacing="2.4" fill="#000000" fill-opacity="0.55">UNOFFICIAL CONCEPT PROTOTYPE</text>

  <text class="s" x="84" y="198" font-size="102" font-weight="700" letter-spacing="-4.5" fill="#111111">Zigi Voice</text>

  <path d="M88 233.5H1192" stroke="#000000" stroke-opacity="0.22" stroke-width="1"/>

  <text class="s" x="88" y="288" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#111111">It understands the need,</text>
  <text class="s" x="88" y="324" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#111111">not the menu name.</text>

  <text class="s" x="88" y="362" font-size="15.5" font-weight="500" fill="#111111" fill-opacity="0.7">Speak Twi, Kusaal or English. Zigi works out which product</text>
  <text class="s" x="88" y="383" font-size="15.5" font-weight="500" fill="#111111" fill-opacity="0.7">you mean, reads it back, and stops at the PIN.</text>

  <text class="s" x="88" y="418" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#000000" fill-opacity="0.45">TWI &#183; KUSAAL &#183; ENGLISH</text>

  <!-- demo card -->
  <rect x="700" y="262" width="492" height="112" fill="#111111"/>

  <g class="rot">
    <text class="m" x="724" y="306" font-size="16.5" fill="#FFFFFF">&#8220;I want data for the night&#8221;<tspan class="caret" fill="#FFCB05">_</tspan></text>
    <text class="s" x="724" y="340" font-size="13.5" font-weight="600" fill="#FFCB05">&#8594; <tspan fill="#8E8E88">Midnight Bundle &#183; 1.5GB &#183; GHS 2 &#183; 12am&#8211;5am</tspan></text>
  </g>
  <g class="rot r2">
    <text class="m" x="724" y="306" font-size="16.5" fill="#FFFFFF">&#8220;Send 20 cedis to Prince&#8221;<tspan class="caret" fill="#FFCB05">_</tspan></text>
    <text class="s" x="724" y="340" font-size="13.5" font-weight="600" fill="#FFCB05">&#8594; <tspan fill="#8E8E88">MoMo &#183; GHS 20 &#183; read back before the PIN</tspan></text>
  </g>
  <g class="rot r3">
    <text class="m" x="724" y="306" font-size="16.5" fill="#FFFFFF">&#8220;Data that won&#8217;t finish&#8221;<tspan class="caret" fill="#FFCB05">_</tspan></text>
    <text class="s" x="724" y="340" font-size="13.5" font-weight="600" fill="#FFCB05">&#8594; <tspan fill="#8E8E88">Flexi Data Bundle &#183; non-expiry &#183; from GHS 0.03</tspan></text>
  </g>
</svg>
