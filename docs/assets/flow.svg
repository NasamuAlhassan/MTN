<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Animated walkthrough of one turn: the user says send 20 cedis to Prince; Zigi asks what the payment is for, the user answers school fees, Zigi reads the whole transfer back for confirmation, the user says yes, and the app opens the PIN gate the assistant never sees. Alongside, the dialogue engine fills its slots: intent, recipient, amount, reference, readback, dispatch, PIN handoff.">
  <defs>
    <clipPath id="scr"><rect x="98" y="58" width="300" height="584" rx="26"/></clipPath>
    <style><![CDATA[
      .s { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }

      /* One 18s stage. The phone and the engine panel share the same cues. */
      .st { opacity: 0; transform-box: fill-box; }
      .s1 { animation: k1 18s ease-out infinite; }
      .s2 { animation: k2 18s ease-out infinite; }
      .s3 { animation: k3 18s ease-out infinite; }
      .s4 { animation: k4 18s ease-out infinite; }
      .s5 { animation: k5 18s ease-out infinite; }
      .s6 { animation: k6 18s ease-out infinite; }

      @keyframes k1 { 0%,2.5%{opacity:0;transform:translateY(7px)} 5.5%,95%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k2 { 0%,13.5%{opacity:0;transform:translateY(7px)} 16.5%,95%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k3 { 0%,25%{opacity:0;transform:translateY(7px)} 28%,95%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k4 { 0%,36%{opacity:0;transform:translateY(7px)} 39%,95%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k5 { 0%,52.5%{opacity:0;transform:translateY(7px)} 55.5%,95%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k6 { 0%,61%{opacity:0;transform:translateY(22px)} 65.5%,95%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }

      .d1 { animation: dot 18s linear infinite; }
      .d2 { animation: dot 18s linear infinite; animation-delay: 0.45s; }
      .d3 { animation: dot 18s linear infinite; animation-delay: 0.9s; }
      .d4 { animation: dot 18s linear infinite; animation-delay: 1.35s; }
      @keyframes dot { 0%,70%{opacity:0.22} 72.5%,95%{opacity:1} 98%,100%{opacity:0.22} }

      .caret { animation: caret 1.06s steps(1) infinite; }
      @keyframes caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    ]]></style>
  </defs>

  <rect width="1240" height="700" fill="#F2F1ED"/>

  <!-- ── phone ─────────────────────────────────────────────────────────── -->
  <rect x="88" y="48" width="320" height="604" rx="34" fill="#111111"/>
  <rect x="98" y="58" width="300" height="584" rx="26" fill="#FFFFFF"/>

  <g clip-path="url(#scr)">
    <rect x="98" y="58" width="300" height="48" fill="#FFCB05"/>
    <circle cx="122" cy="82" r="11" fill="#111111"/>
    <text class="s" x="122" y="87" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFCB05">Z</text>
    <text class="s" x="142" y="79" font-size="13" font-weight="700" fill="#111111">Zigi</text>
    <text class="s" x="142" y="93" font-size="9.5" font-weight="500" fill="#111111" fill-opacity="0.6">Listening &#183; English</text>

    <!-- 1 -->
    <g class="st s1">
      <rect x="221" y="120" width="167" height="32" rx="4" fill="#111111"/>
      <text class="s" x="237" y="141" font-size="12" font-weight="500" fill="#FFFFFF">Send 20 cedis to Prince</text>
    </g>

    <!-- 2 -->
    <g class="st s2">
      <rect x="108" y="160" width="179" height="32" rx="4" fill="#E6E5E0"/>
      <text class="s" x="124" y="181" font-size="12" font-weight="500" fill="#111111">What is this payment for?</text>
    </g>

    <!-- 3 -->
    <g class="st s3">
      <rect x="296" y="200" width="92" height="32" rx="4" fill="#111111"/>
      <text class="s" x="312" y="221" font-size="12" font-weight="500" fill="#FFFFFF">School fees</text>
    </g>

    <!-- 4 · read-back -->
    <g class="st s4">
      <rect x="108" y="240" width="244" height="100" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
      <rect x="108" y="240" width="5" height="100" fill="#FFCB05"/>
      <text class="s" x="128" y="264" font-size="11.5" font-weight="500" fill="#111111">You are sending 20 cedis to</text>
      <text class="s" x="128" y="280" font-size="11.5" font-weight="500" fill="#111111">Prince Mensah, number</text>
      <text class="s" x="128" y="296" font-size="11.5" font-weight="500" fill="#111111">0 2 4 4 0 0 0 1 1 1, reference</text>
      <text class="s" x="128" y="312" font-size="11.5" font-weight="500" fill="#111111">school fees.</text>
      <text class="s" x="128" y="330" font-size="11.5" font-weight="700" fill="#111111">Should I continue?</text>
    </g>

    <!-- 5 -->
    <g class="st s5">
      <rect x="345" y="348" width="43" height="32" rx="4" fill="#111111"/>
      <text class="s" x="366" y="369" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF">Yes</text>
    </g>

    <!-- input bar -->
    <path d="M98 586.5H398" stroke="#E0DFDA" stroke-width="1"/>
    <rect x="112" y="600" width="238" height="30" rx="4" fill="#F2F1ED"/>
    <text class="s" x="126" y="620" font-size="11.5" fill="#111111" fill-opacity="0.42">Type or tap the mic<tspan class="caret" fill="#111111">|</tspan></text>
    <rect x="360" y="600" width="30" height="30" rx="4" fill="#FFCB05"/>
    <g transform="translate(375,608)" fill="#111111">
      <rect x="-2.5" y="0" width="5" height="9" rx="2.5"/>
      <path d="M-5 7a5 5 0 0 0 10 0" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="-0.8" y="11" width="1.6" height="3"/>
    </g>

    <!-- 6 · PIN gate -->
    <g class="st s6">
      <rect x="98" y="396" width="300" height="246" fill="#111111"/>
      <rect x="98" y="396" width="300" height="4" fill="#FFCB05"/>
      <text class="s" x="248" y="440" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Enter your PIN</text>
      <text class="s" x="248" y="458" text-anchor="middle" font-size="10" font-weight="500" fill="#FFFFFF" fill-opacity="0.5">to confirm this transaction</text>

      <g fill="#FFCB05">
        <circle class="d1" cx="203" cy="488" r="6.5"/>
        <circle class="d2" cx="233" cy="488" r="6.5"/>
        <circle class="d3" cx="263" cy="488" r="6.5"/>
        <circle class="d4" cx="293" cy="488" r="6.5"/>
      </g>

      <g fill="#1E1E1E">
        <rect x="158" y="516" width="56" height="30"/><rect x="220" y="516" width="56" height="30"/><rect x="282" y="516" width="56" height="30"/>
        <rect x="158" y="552" width="56" height="30"/><rect x="220" y="552" width="56" height="30"/><rect x="282" y="552" width="56" height="30"/>
      </g>
      <g class="s" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">
        <text x="186" y="536">1</text><text x="248" y="536">2</text><text x="310" y="536">3</text>
        <text x="186" y="572">4</text><text x="248" y="572">5</text><text x="310" y="572">6</text>
      </g>

      <g transform="translate(178,604)">
        <rect x="0" y="4" width="9" height="7" fill="#FFCB05"/>
        <path d="M1.8 4V2.4a2.7 2.7 0 0 1 5.4 0V4" fill="none" stroke="#FFCB05" stroke-width="1.3"/>
      </g>
      <text class="s" x="194" y="612" font-size="10" font-weight="600" fill="#FFCB05">Zigi never sees this</text>
    </g>
  </g>

  <!-- ── engine panel ──────────────────────────────────────────────────── -->
  <text class="s" x="520" y="82" font-size="11" font-weight="700" letter-spacing="2.4" fill="#111111" fill-opacity="0.45">THE DIALOGUE ENGINE, IN STEP</text>
  <text class="m" x="520" y="112" font-size="13" fill="#111111">src/voice/dialogue.js<tspan fill="#111111" fill-opacity="0.4"> &#183; processUtterance()</tspan></text>
  <path d="M520 134.5H1176" stroke="#111111" stroke-opacity="0.18" stroke-width="1"/>

  <g font-size="13.5">
    <g class="st s1">
      <text class="s" x="520" y="180" font-weight="500" fill="#111111" fill-opacity="0.45">intent</text>
      <text class="m" x="700" y="180" font-weight="700" fill="#111111">send</text>
      <rect x="697" y="186" width="42" height="3" fill="#FFCB05"/>
      <text class="s" x="790" y="180" font-weight="500" fill="#111111" fill-opacity="0.4">matched by rules, no model required</text>
    </g>
    <g class="st s2">
      <text class="s" x="520" y="220" font-weight="500" fill="#111111" fill-opacity="0.45">recipient</text>
      <text class="m" x="700" y="220" fill="#111111">Prince Mensah</text>
      <text class="s" x="880" y="220" font-weight="500" fill="#111111" fill-opacity="0.4">024 400 0111</text>
    </g>
    <g class="st s2">
      <text class="s" x="520" y="260" font-weight="500" fill="#111111" fill-opacity="0.45">amount</text>
      <text class="m" x="700" y="260" fill="#111111">GHS 20.00</text>
      <text class="s" x="880" y="260" font-weight="500" fill="#111111" fill-opacity="0.4">read as money, not as a phone number</text>
    </g>
    <g class="st s3">
      <text class="s" x="520" y="300" font-weight="500" fill="#111111" fill-opacity="0.45">reference</text>
      <text class="m" x="700" y="300" fill="#111111">school fees</text>
    </g>

    <path class="st s4" d="M520 326.5H1176" stroke="#111111" stroke-opacity="0.18" stroke-width="1"/>

    <g class="st s4">
      <text class="s" x="520" y="366" font-weight="500" fill="#111111" fill-opacity="0.45">readback</text>
      <text class="m" x="700" y="366" fill="#111111">spoken + shown</text>
      <text class="s" x="880" y="366" font-weight="500" fill="#111111" fill-opacity="0.4">nothing is committed yet</text>
    </g>
    <g class="st s5">
      <text class="s" x="520" y="406" font-weight="500" fill="#111111" fill-opacity="0.45">dispatch</text>
      <text class="m" x="700" y="406" fill="#111111">momo &#8250; send</text>
      <text class="s" x="880" y="406" font-weight="500" fill="#111111" fill-opacity="0.4">the real screen, prefilled</text>
    </g>
    <g class="st s6">
      <text class="s" x="520" y="446" font-weight="500" fill="#111111" fill-opacity="0.45">pin</text>
      <text class="m" x="700" y="446" font-weight="700" fill="#111111">handed off</text>
      <rect x="697" y="452" width="104" height="3" fill="#FFCB05"/>
      <text class="s" x="880" y="446" font-weight="500" fill="#111111" fill-opacity="0.4">the assistant is blind past this line</text>
    </g>
  </g>

  <g class="st s6">
    <rect x="520" y="510" width="5" height="86" fill="#FFCB05"/>
    <text class="s" x="546" y="536" font-size="17" font-weight="700" fill="#111111">The screen follows the conversation.</text>
    <text class="s" x="546" y="562" font-size="13.5" font-weight="500" fill="#111111" fill-opacity="0.6">Slots become navigation as they fill, so the customer watches the real</text>
    <text class="s" x="546" y="582" font-size="13.5" font-weight="500" fill="#111111" fill-opacity="0.6">form populate instead of trusting a summary they cannot check.</text>
  </g>
</svg>
