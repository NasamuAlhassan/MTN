<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-label="Request flow for one voice turn: the microphone feeds speech recognition (Groq Whisper, then Khaya v3, then Web Speech); Twi and Kusaal are translated to English by Khaya; understanding runs rules first with an optional LLM; the dialogue state machine fills slots and produces a readback; output goes to the prefilled screen and to speech, then to the PIN gate. Every provider call passes through a same-origin proxy so API keys stay on the server.">
  <defs>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#111111"/>
    </marker>
    <style><![CDATA[
      .s { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }

      .box  { fill: #FFFFFF; stroke: #111111; stroke-width: 1.5; }
      .link { stroke: #111111; stroke-width: 1.5; fill: none; }

      /* Each stage takes the accent in turn — the path a single turn travels. */
      .bar { fill: #FFCB05; transform-box: fill-box; transform-origin: 0% 50%; animation-duration: 7s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      .w1 { animation-name: w1; } .w2 { animation-name: w2; } .w3 { animation-name: w3; }
      .w4 { animation-name: w4; } .w5 { animation-name: w5; } .w6 { animation-name: w6; }
      @keyframes w1 { 0%{transform:scaleX(0)}      8%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
      @keyframes w2 { 0%,12%{transform:scaleX(0)} 20%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
      @keyframes w3 { 0%,24%{transform:scaleX(0)} 32%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
      @keyframes w4 { 0%,36%{transform:scaleX(0)} 44%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
      @keyframes w5 { 0%,48%{transform:scaleX(0)} 56%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
      @keyframes w6 { 0%,60%{transform:scaleX(0)} 68%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    ]]></style>
  </defs>

  <rect width="1240" height="400" fill="#F2F1ED"/>

  <text class="s" x="48" y="56" font-size="11" font-weight="700" letter-spacing="2.4" fill="#111111" fill-opacity="0.45">ONE VOICE TURN, END TO END</text>

  <!-- connectors -->
  <g class="link" marker-end="url(#ar)">
    <path d="M198 158 H222"/>
    <path d="M404 158 H428"/>
    <path d="M610 158 H634"/>
    <path d="M816 158 H840"/>
  </g>
  <g class="link">
    <path d="M1022 158 H1037 V108 H1046" marker-end="url(#ar)"/>
    <path d="M1022 158 H1037 V208 H1046" marker-end="url(#ar)"/>
    <path d="M1122 240 V280" marker-end="url(#ar)"/>
  </g>

  <!-- 1 · mic -->
  <rect class="box" x="48" y="110" width="150" height="96"/>
  <rect class="bar w1" x="48" y="110" width="150" height="5"/>
  <g transform="translate(123,146)" fill="#111111">
    <rect x="-4.5" y="-12" width="9" height="17" rx="4.5"/>
    <path d="M-9 0a9 9 0 0 0 18 0" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="-1" y="6" width="2" height="6"/>
  </g>
  <text class="s" x="123" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111111">User speaks</text>

  <!-- 2 · asr -->
  <rect class="box" x="222" y="110" width="182" height="96"/>
  <rect class="bar w2" x="222" y="110" width="182" height="5"/>
  <text class="s" x="313" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Speech to text</text>
  <text class="s" x="313" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">Groq Whisper &#8250; Khaya v3</text>
  <text class="s" x="313" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">&#8250; Web Speech</text>
  <text class="m" x="313" y="194" text-anchor="middle" font-size="9.5" fill="#111111" fill-opacity="0.35">voice/asr.js</text>

  <!-- 3 · translate -->
  <rect class="box" x="428" y="110" width="182" height="96"/>
  <rect class="bar w3" x="428" y="110" width="182" height="5"/>
  <rect x="428" y="86" width="98" height="18" fill="#111111"/>
  <text class="s" x="477" y="99" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#FFCB05">TW / KUS ONLY</text>
  <text class="s" x="519" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Translate</text>
  <text class="s" x="519" y="167" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">Khaya &#183; local to English</text>
  <text class="m" x="519" y="190" text-anchor="middle" font-size="9.5" fill="#111111" fill-opacity="0.35">voice/khayaPipeline.js</text>

  <!-- 4 · understand -->
  <rect class="box" x="634" y="110" width="182" height="96"/>
  <rect class="bar w4" x="634" y="110" width="182" height="5"/>
  <text class="s" x="725" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Understand</text>
  <text class="s" x="725" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">rules first, LLM optional</text>
  <text class="s" x="725" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">and only above 0.55</text>
  <text class="m" x="725" y="194" text-anchor="middle" font-size="9.5" fill="#111111" fill-opacity="0.35">voice/understand.js</text>

  <!-- 5 · dialogue -->
  <rect class="box" x="840" y="110" width="182" height="96"/>
  <rect class="bar w5" x="840" y="110" width="182" height="5"/>
  <text class="s" x="931" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#111111">Dialogue FSM</text>
  <text class="s" x="931" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">slots &#183; read-back</text>
  <text class="s" x="931" y="175" text-anchor="middle" font-size="11" font-weight="500" fill="#111111" fill-opacity="0.55">pure &#183; fully tested</text>
  <text class="m" x="931" y="194" text-anchor="middle" font-size="9.5" fill="#111111" fill-opacity="0.35">voice/dialogue.js</text>

  <!-- outputs -->
  <rect class="box" x="1046" y="76" width="152" height="64"/>
  <rect class="bar w6" x="1046" y="76" width="152" height="5"/>
  <text class="s" x="1122" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111111">Screen fills</text>
  <text class="s" x="1122" y="122" text-anchor="middle" font-size="10.5" font-weight="500" fill="#111111" fill-opacity="0.55">the real form, prefilled</text>

  <rect class="box" x="1046" y="176" width="152" height="64"/>
  <rect class="bar w6" x="1046" y="176" width="152" height="5"/>
  <text class="s" x="1122" y="203" text-anchor="middle" font-size="12.5" font-weight="700" fill="#111111">Zigi speaks</text>
  <text class="s" x="1122" y="222" text-anchor="middle" font-size="10.5" font-weight="500" fill="#111111" fill-opacity="0.55">Khaya TTS / Web Speech</text>

  <!-- pin -->
  <rect x="1046" y="280" width="152" height="62" fill="#111111"/>
  <g transform="translate(1078,299)">
    <rect x="0" y="5" width="10" height="8" fill="#FFCB05"/>
    <path d="M2 5V3a3 3 0 0 1 6 0v2" fill="none" stroke="#FFCB05" stroke-width="1.4"/>
  </g>
  <text class="s" x="1096" y="311" font-size="12.5" font-weight="700" fill="#FFCB05">PIN gate</text>
  <text class="s" x="1122" y="330" text-anchor="middle" font-size="10.5" font-weight="500" fill="#FFFFFF" fill-opacity="0.6">the assistant never sees it</text>

  <!-- proxy lane -->
  <g stroke="#111111" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <path d="M313 206 V262"/>
    <path d="M519 206 V262"/>
    <path d="M725 206 V262"/>
  </g>
  <rect x="222" y="262" width="800" height="80" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="222" y="262" width="5" height="80" fill="#FFCB05"/>
  <text class="s" x="248" y="290" font-size="11" font-weight="700" letter-spacing="1.8" fill="#111111">SAME-ORIGIN PROXY</text>
  <text class="s" x="248" y="312" font-size="12.5" font-weight="500" fill="#111111" fill-opacity="0.7">Every provider call is routed through <tspan class="m" fill="#111111">/api/*</tspan>. Keys are injected server-side, rate-limited,</text>
  <text class="s" x="248" y="330" font-size="12.5" font-weight="500" fill="#111111" fill-opacity="0.7">and never enter the browser bundle. <tspan class="m" fill="#111111" fill-opacity="0.45">api/_lib/handlers.js</tspan></text>
</svg>
