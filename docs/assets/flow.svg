<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Animated demo: the user says Send 20 cedis to Prince; Zigi asks what the payment is for, the user says school fees, Zigi reads the whole transfer back for confirmation, the user says yes, and the app opens the PIN gate that the assistant never sees. Alongside, the dialogue engine fills its slots: intent, recipient, amount, reference, readback, dispatch, PIN handoff.">
  <defs>
    <linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="f-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFCB05" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFCB05" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="f-screen"><rect x="100" y="46" width="320" height="600" rx="26"/></clipPath>

    <style><![CDATA[
      .f { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

      /* One shared 18s stage. Each step has its own cue so the phone and the
         engine panel stay in lockstep, then everything clears and replays. */
      .st { opacity: 0; transform-box: fill-box; }
      .s1 { animation: k1 18s ease-out infinite; }
      .s2 { animation: k2 18s ease-out infinite; }
      .s3 { animation: k3 18s ease-out infinite; }
      .s4 { animation: k4 18s ease-out infinite; }
      .s5 { animation: k5 18s ease-out infinite; }
      .s6 { animation: k6 18s ease-out infinite; }

      @keyframes k1 { 0%,2.5%{opacity:0;transform:translateY(10px)} 6%,94%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k2 { 0%,13.5%{opacity:0;transform:translateY(10px)} 17%,94%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k3 { 0%,25%{opacity:0;transform:translateY(10px)} 28.5%,94%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k4 { 0%,36%{opacity:0;transform:translateY(10px)} 39.5%,94%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k5 { 0%,52.5%{opacity:0;transform:translateY(10px)} 56%,94%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }
      @keyframes k6 { 0%,61%{opacity:0;transform:translateY(26px)} 66%,94%{opacity:1;transform:translateY(0)} 98%,100%{opacity:0;transform:translateY(0)} }

      /* PIN dots land one at a time once the gate is up. */
      .d1 { animation: dot 18s linear infinite; }
      .d2 { animation: dot 18s linear infinite; animation-delay: 0.5s; }
      .d3 { animation: dot 18s linear infinite; animation-delay: 1s; }
      .d4 { animation: dot 18s linear infinite; animation-delay: 1.5s; }
      @keyframes dot { 0%,70%{opacity:0.18} 73%,94%{opacity:1} 98%,100%{opacity:0.18} }

      .mic { animation: mic 1.8s ease-in-out infinite; }
      @keyframes mic { 0%,100%{opacity:0.3} 50%{opacity:1} }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    ]]></style>
  </defs>

  <rect width="1240" height="700" fill="url(#f-bg)"/>
  <ellipse cx="880" cy="330" rx="430" ry="330" fill="url(#f-glow)"/>

  <!-- ── phone ─────────────────────────────────────────────────────────── -->
  <rect x="90" y="36" width="340" height="620" rx="38" fill="#141416" stroke="#2A2A2E" stroke-width="1.5"/>
  <rect x="100" y="46" width="320" height="600" rx="28" fill="#FFFFFF"/>

  <g clip-path="url(#f-screen)">
    <!-- app header -->
    <rect x="100" y="46" width="320" height="52" fill="#FFCB05"/>
    <circle cx="126" cy="72" r="12" fill="#0A0A0A"/>
    <text class="f" x="126" y="77" text-anchor="middle" font-size="12" font-weight="800" fill="#FFCB05">Z</text>
    <text class="f" x="148" y="70" font-size="13.5" font-weight="800" fill="#0A0A0A">Zigi</text>
    <text class="f" x="148" y="84" font-size="9.5" font-weight="600" fill="#6B5600">Listening &#183; English</text>
    <g class="mic" transform="translate(396,72)">
      <circle r="4.5" fill="#0A0A0A"/>
    </g>

    <!-- 1 · user -->
    <g class="st s1">
      <rect x="247" y="110" width="163" height="34" rx="14" fill="#141416"/>
      <text class="f" x="263" y="132" font-size="12" font-weight="600" fill="#FFFFFF">Send 20 cedis to Prince</text>
    </g>

    <!-- 2 · zigi asks for the reference -->
    <g class="st s2">
      <rect x="110" y="154" width="184" height="34" rx="14" fill="#F1F1F3"/>
      <text class="f" x="126" y="176" font-size="12" font-weight="600" fill="#141416">What is this payment for?</text>
    </g>

    <!-- 3 · user -->
    <g class="st s3">
      <rect x="317" y="198" width="93" height="34" rx="14" fill="#141416"/>
      <text class="f" x="333" y="220" font-size="12" font-weight="600" fill="#FFFFFF">School fees</text>
    </g>

    <!-- 4 · the read-back, spoken and shown before anything is committed -->
    <g class="st s4">
      <rect x="110" y="242" width="252" height="104" rx="14" fill="#FFFBEA" stroke="#FFCB05" stroke-width="1.5"/>
      <text class="f" x="126" y="264" font-size="11.5" font-weight="600" fill="#141416">You are sending 20 cedis to</text>
      <text class="f" x="126" y="281" font-size="11.5" font-weight="600" fill="#141416">Prince Mensah, number</text>
      <text class="f" x="126" y="298" font-size="11.5" font-weight="600" fill="#141416">0 2 4 4 0 0 0 1 1 1, reference</text>
      <text class="f" x="126" y="315" font-size="11.5" font-weight="600" fill="#141416">school fees.</text>
      <text class="f" x="126" y="334" font-size="11.5" font-weight="800" fill="#8A6D00">Should I continue?</text>
    </g>

    <!-- 5 · user confirms -->
    <g class="st s5">
      <rect x="367" y="356" width="43" height="34" rx="14" fill="#141416"/>
      <text class="f" x="388" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Yes</text>
    </g>

    <!-- input bar -->
    <rect x="100" y="590" width="320" height="56" fill="#FAFAFB"/>
    <rect x="114" y="602" width="252" height="32" rx="16" fill="#FFFFFF" stroke="#E2E2E6"/>
    <text class="f" x="130" y="622" font-size="11.5" fill="#A6A6AE">Type or tap the mic<tspan class="cursor" fill="#141416">|</tspan></text>
    <circle cx="394" cy="618" r="16" fill="#FFCB05"/>
    <g fill="#0A0A0A" transform="translate(390,610)">
      <rect x="2" y="0" width="5" height="10" rx="2.5"/>
      <path d="M-0.5 8a5 5 0 0 0 10 0" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="3.7" y="12" width="1.6" height="3" rx="0.8"/>
    </g>

    <!-- 6 · PIN gate slides up; the assistant is shut out here -->
    <g class="st s6">
      <rect x="100" y="404" width="320" height="242" rx="24" fill="#0A0A0A"/>
      <rect x="228" y="418" width="64" height="4" rx="2" fill="#3A3A40"/>
      <text class="f" x="260" y="452" text-anchor="middle" font-size="13.5" font-weight="800" fill="#FFFFFF">Enter your PIN</text>
      <text class="f" x="260" y="470" text-anchor="middle" font-size="10" font-weight="600" fill="#7A7A82">to confirm this transaction</text>

      <g fill="#FFCB05">
        <circle class="d1" cx="212" cy="498" r="7"/>
        <circle class="d2" cx="240" cy="498" r="7"/>
        <circle class="d3" cx="268" cy="498" r="7"/>
        <circle class="d4" cx="296" cy="498" r="7"/>
      </g>

      <g fill="#18181B">
        <rect x="168" y="524" width="56" height="30" rx="8"/><rect x="232" y="524" width="56" height="30" rx="8"/><rect x="296" y="524" width="56" height="30" rx="8"/>
        <rect x="168" y="560" width="56" height="30" rx="8"/><rect x="232" y="560" width="56" height="30" rx="8"/><rect x="296" y="560" width="56" height="30" rx="8"/>
      </g>
      <g class="f" font-size="13" font-weight="700" fill="#E6E6EA" text-anchor="middle">
        <text x="196" y="544">1</text><text x="260" y="544">2</text><text x="324" y="544">3</text>
        <text x="196" y="580">4</text><text x="260" y="580">5</text><text x="324" y="580">6</text>
      </g>

      <text class="f" x="260" y="614" text-anchor="middle" font-size="9.5" font-weight="700" fill="#FFCB05">&#128274; Zigi never sees this</text>
    </g>
  </g>

  <!-- ── engine panel ──────────────────────────────────────────────────── -->
  <text class="f" x="520" y="72" font-size="12" font-weight="700" letter-spacing="2" fill="#5E5E68">WHAT THE ENGINE DOES</text>
  <text class="m" x="520" y="98" font-size="12.5" fill="#FFCB05">src/voice/dialogue.js<tspan fill="#4A4A52"> &#183; processUtterance()</tspan></text>
  <rect x="520" y="116" width="640" height="1" fill="#FFFFFF" fill-opacity="0.10"/>

  <g class="m" font-size="13.5">
    <g class="st s1">
      <text x="520" y="162" fill="#5E5E68">intent</text>
      <text x="700" y="162" fill="#FFCB05" font-weight="700">send</text>
      <text x="770" y="162" fill="#3E3E46">matchIntent() &#8212; rules, no model needed</text>
    </g>
    <g class="st s2">
      <text x="520" y="200" fill="#5E5E68">recipient</text>
      <text x="700" y="200" fill="#EDEDF0">Prince Mensah</text>
      <text x="860" y="200" fill="#3E3E46">024 400 0111</text>
    </g>
    <g class="st s2">
      <text x="520" y="238" fill="#5E5E68">amount</text>
      <text x="700" y="238" fill="#EDEDF0">GHS 20.00</text>
      <text x="810" y="238" fill="#3E3E46">parsed as money, not a phone number</text>
    </g>
    <g class="st s3">
      <text x="520" y="276" fill="#5E5E68">reference</text>
      <text x="700" y="276" fill="#EDEDF0">school fees</text>
    </g>

    <rect class="st s4" x="520" y="302" width="640" height="1" fill="#FFFFFF" fill-opacity="0.10"/>

    <g class="st s4">
      <text x="520" y="340" fill="#5E5E68">readback</text>
      <text x="700" y="340" fill="#EDEDF0">spoken + shown</text>
      <text x="870" y="340" fill="#3E3E46">nothing is committed yet</text>
    </g>
    <g class="st s5">
      <text x="520" y="378" fill="#5E5E68">dispatch</text>
      <text x="700" y="378" fill="#EDEDF0">momo &#8250; send</text>
      <text x="840" y="378" fill="#3E3E46">real screen, fields prefilled</text>
    </g>
    <g class="st s6">
      <text x="520" y="416" fill="#5E5E68">pin</text>
      <text x="700" y="416" fill="#FFCB05" font-weight="700">handed off</text>
      <text x="840" y="416" fill="#3E3E46">assistant is blind past this line</text>
    </g>
  </g>

  <!-- footnote -->
  <g class="st s6">
    <rect x="520" y="470" width="640" height="86" rx="14" fill="#FFCB05" fill-opacity="0.06" stroke="#FFCB05" stroke-opacity="0.22"/>
    <text class="f" x="544" y="502" font-size="14" font-weight="800" fill="#FFCB05">The screen follows the conversation.</text>
    <text class="f" x="544" y="526" font-size="13" font-weight="500" fill="#9A9AA2">Slots become navigation as they fill &#8212; the user watches the real form</text>
    <text class="f" x="544" y="544" font-size="13" font-weight="500" fill="#9A9AA2">populate, so nothing about the transfer is hidden behind the voice.</text>
  </g>
</svg>
